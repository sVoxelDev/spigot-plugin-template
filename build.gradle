plugins {
    id 'java'
    id 'jacoco'
    id 'maven-publish'
}

group = providers.gradleProperty('group').get()
version = providers.gradleProperty('version').get()

java {
    toolchain.languageVersion = JavaLanguageVersion.of(providers.gradleProperty('javaVersion').get().toInteger())
    withSourcesJar()
    withJavadocJar()
}

repositories {
    mavenCentral()
    maven {
        name = 'papermc'
        url = uri('https://repo.papermc.io/repository/maven-public/')
        content { includeGroupByRegex 'io\\.papermc.*'; includeGroup 'net.md-5'; includeGroup 'com.mojang' }
    }
}

dependencies {
    compileOnly "io.papermc.paper:paper-api:${paperApiVersion}"
    testImplementation "io.papermc.paper:paper-api:${paperApiVersion}"
    testImplementation "org.mockbukkit.mockbukkit:mockbukkit-v26.2:${mockBukkitVersion}"
    testImplementation platform("org.junit:junit-bom:${junitVersion}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = providers.gradleProperty('javaVersion').map { it.toInteger() }
    options.compilerArgs.addAll(['-Xlint:all', '-Werror'])
}

tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}

tasks.named('jar') {
    archiveBaseName = pluginName
}

tasks.named('processResources') {
    def metadata = [pluginName: pluginName, version: version, author: author,
                    packageName: packageName, apiVersion: apiVersion, commandName: commandName]
    inputs.properties(metadata)
    filesMatching('plugin.yml') { expand(metadata) }
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging { events 'failed', 'skipped'; exceptionFormat = 'full' }
    finalizedBy tasks.named('jacocoTestReport')
}

jacoco { toolVersion = jacocoVersion }

tasks.named('jacocoTestReport') {
    dependsOn tasks.named('test')
    reports { xml.required = true; html.required = true }
}

tasks.named('javadoc') {
    options.encoding = 'UTF-8'
    options.addStringOption('Xdoclint:all,-missing', '-quiet')
}

publishing {
    publications {
        plugin(MavenPublication) { from components.java }
    }
    repositories {
        maven {
            name = 'GitHubPackages'
            url = uri("https://maven.pkg.github.com/${System.getenv('GITHUB_REPOSITORY') ?: 'sVoxelDev/spigot-plugin-template'}")
            credentials {
                username = providers.gradleProperty('gpr.user').orElse(providers.environmentVariable('GITHUB_ACTOR')).orNull
                password = providers.gradleProperty('gpr.key').orElse(providers.environmentVariable('GITHUB_TOKEN')).orNull
            }
        }
    }
}

defaultTasks 'build'
